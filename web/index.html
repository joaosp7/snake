<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <style>
      :root {
        color-scheme: dark;
        background: #101414;
        font-family: system-ui, sans-serif;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="0"></canvas>
    <script src="./gl.js"></script>
    <script>load("raylib-rs.wasm");</script>
  </body>
